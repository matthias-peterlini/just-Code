name: Build & Release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke test
        run: node dist/cli.js --version && node dist/cli.js --help
      - name: Pack
        run: |
          npm pack
          mkdir -p out
          mv just-code-*.tgz out/
          cp out/just-code-*.tgz out/just-code.tgz
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: just-code
          path: out/*.tgz

      - name: Decide whether to release
        id: rel
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - bump the version in package.json to publish a new one."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: just-Code ${{ steps.rel.outputs.tag }}
          make_latest: true
          files: out/*.tgz
          generate_release_notes: true
          body: |
            ## Installazione
            ```
            npm install -g https://code.justapps.it/latest.tgz
            ```
            oppure `curl -fsSL https://code.justapps.it/install.sh | sh` (macOS/Linux) · `irm https://code.justapps.it/install.ps1 | iex` (Windows)
