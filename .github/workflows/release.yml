name: Build & Release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: CLI starts
        run: |
          node dist/cli.js --version
          node dist/cli.js --help
      - name: Install the packed package globally and run it
        shell: bash
        run: |
          npm pack
          npm install -g ./justapps-just-code-*.tgz
          just-code --version
          jc --version

  release:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Pack
        run: |
          npm pack
          mkdir -p out
          mv justapps-just-code-*.tgz out/
          cp out/justapps-just-code-*.tgz out/just-code.tgz
          ls -la out

      - name: What is already published?
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then echo "npm=false" >> "$GITHUB_OUTPUT"; else echo "npm=true" >> "$GITHUB_OUTPUT"; fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "gh=false" >> "$GITHUB_OUTPUT"; else echo "gh=true" >> "$GITHUB_OUTPUT"; fi

      - name: Publish to npm
        if: steps.state.outputs.npm == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN secret is not set - skipping npm publish. Add it in Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 0
          fi
          npm publish ./out/just-code.tgz --access public --provenance

      - name: Publish GitHub release
        if: steps.state.outputs.gh == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.state.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: just-Code ${{ steps.state.outputs.tag }}
          make_latest: true
          files: out/*.tgz
          generate_release_notes: true
          body: |
            ## Installazione (macOS, Linux, Windows · Node.js 20+)
            ```
            npm install -g @justapps/just-code
            ```
            oppure `curl -fsSL https://code.justapps.it/install.sh | sh` (macOS/Linux) · `irm https://code.justapps.it/install.ps1 | iex` (Windows)
