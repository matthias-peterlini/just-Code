name: Build & Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke test
        run: node dist/cli.js --version && node dist/cli.js --help
      - name: Pack
        run: |
          npm pack
          mkdir -p out
          mv just-code-*.tgz out/
          cp out/just-code-*.tgz out/just-code.tgz
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: just-code
          path: out/*.tgz

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          [ "$PKG" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != package.json $PKG"; exit 1; }
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.tgz
          generate_release_notes: true
          body: |
            ## Installazione
            ```
            npm install -g https://code.justapps.it/latest.tgz
            ```
            oppure `curl -fsSL https://code.justapps.it/install.sh | sh` (macOS/Linux) · `irm https://code.justapps.it/install.ps1 | iex` (Windows)
